# Akura AI - Docker Compose Configuration
# Development and production deployment options

version: "3.8"

services:
  # ============================================
  # Akura AI Backend API
  # ============================================
  akura-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: akura-ai-backend
    restart: unless-stopped
    ports:
      - "8000:8000"
    environment:
      - HOST=0.0.0.0
      - PORT=8000
      - DEBUG=false
      - ENVIRONMENT=production
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=hf.co/hasinduOnline/akura_ai_sinhala_dyslexic_word_corrector_4bit:Q4_K_M
      - OLLAMA_TIMEOUT=300
      - MODEL_TEMPERATURE=0.3
      - MODEL_MAX_TOKENS=2048
      - AI_CONFIDENCE_THRESHOLD=0.7
      - LOG_LEVEL=INFO
      - ALLOWED_ORIGINS=*
      - LLM_PROVIDER=ollama
      - ENABLE_DUAL_MODEL=true
      - SECONDARY_OLLAMA_MODEL=gemini-3-flash-preview:latest
      - SECONDARY_OLLAMA_TIMEOUT=300
      - SECONDARY_OLLAMA_TEMPERATURE=0.3
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - akura-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/v1/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ============================================
  # Ollama LLM Service
  # ============================================
  ollama:
    image: ollama/ollama:latest
    container_name: akura-ollama
    restart: unless-stopped
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    environment:
      - OLLAMA_HOST=0.0.0.0
    networks:
      - akura-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:11434/api/tags"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s
    # Pull the model on startup (uncomment for first run)
    # command: >
    #   sh -c "ollama pull llama3.2:1b && ollama serve"

  # ============================================
  # Model Initialization (Run once)
  # Requires: ollama login google (on host) before first run
  # ============================================
  model-init:
    image: ollama/ollama:latest
    container_name: akura-model-init
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - akura-network
    entrypoint: >
      sh -c "
        echo 'Pulling Akura fine-tuned model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"hf.co/hasinduOnline/akura_ai_sinhala_dyslexic_word_corrector_4bit:Q4_K_M\"}' &&
        echo 'Pulling secondary model...' &&
        curl -X POST http://ollama:11434/api/pull -d '{\"name\": \"gemini-3-flash-preview:latest\"}' &&
        echo 'Both models pulled successfully!'
      "
    restart: "no"

networks:
  akura-network:
    driver: bridge

volumes:
  ollama-data:
    driver: local
